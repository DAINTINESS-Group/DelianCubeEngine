DATASOURCE TYPE: RDBMS WITH INI FILE: InputFiles/northwind/dbc.ini;

CREATE DIMENSION customers_dim
LIST OF LEVELS {
	CREATE LEVEL customer WITH ATTRIBUTES{
		customerID: Text DATASOURCE customerID,
		companyName: Text DATASOURCE companyName,
		contactName: Text DATASOURCE contactName,
		contactTitle: Text DATASOURCE contactTitle,
		address: Text DATASOURCE address,
		region: Text DATASOURCE region,
		postalCode: Text DATASOURCE postalCode,
		phone: Text DATASOURCE phone,
		fax: Text DATASOURCE fax
	} WITH ID: customerID AND DESCRIPTION: customerID,
	CREATE LEVEL customer_city WITH ATTRIBUTES{
		city: Text DATASOURCE customer_city
	} WITH ID: city AND DESCRIPTION: city,
	CREATE LEVEL customer_country WITH ATTRIBUTES{
		country: Text DATASOURCE customer_country
	} WITH ID: country AND DESCRIPTION: country,
	CREATE LEVEL All_customers_dim WITH ATTRIBUTES{
		All: Text DATASOURCE All
	} WITH ID: All AND DESCRIPTION: All	
}
HIERARCHY customer>customer_city>customer_country>All_customers_dim
DATASOURCE customers_dim;


CREATE DIMENSION date_dim
LIST OF LEVELS {
	CREATE LEVEL date WITH ATTRIBUTES{
		date_and_time: Date DATASOURCE date_and_time,
		full_date: Date DATASOURCE full_date,
		week: Number DATASOURCE week,
		day: Number DATASOURCE day,
		day_name: Text DATASOURCE day_name,
		month_name: Text DATASOURCE month_name,
		quarter: Number DATASOURCE quarter
	} WITH ID: date_and_time AND DESCRIPTION: date_and_time,
	CREATE LEVEL month WITH ATTRIBUTES{
		month: Text DATASOURCE month
	} WITH ID: month AND DESCRIPTION: month,
	CREATE LEVEL quarter WITH ATTRIBUTES{
		quarter_name: Text DATASOURCE quarter_name
	} WITH ID: quarter_name AND DESCRIPTION: quarter_name,
	CREATE LEVEL year WITH ATTRIBUTES{
		year: Number DATASOURCE year
	} WITH ID: year AND DESCRIPTION: year,
	CREATE LEVEL All_date_dim WITH ATTRIBUTES{
		All: Text DATASOURCE All
	} WITH ID: All AND DESCRIPTION: All	
}
HIERARCHY date>month>quarter>year>All_date_dim
DATASOURCE date_dim;



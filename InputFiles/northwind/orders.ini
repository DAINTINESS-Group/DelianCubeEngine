CREATE DIMENSION products_dim
LIST OF LEVELS {
	CREATE LEVEL product WITH ATTRIBUTES{
		productID: Number DATASOURCE productID,
		supplierID: Number DATASOURCE supplierID,
		quantityPerUnit: Text DATASOURCE quantityPerUnit,
		unitPrice: Number DATASOURCE unitPrice,
		unitsInStock: Number DATASOURCE unitsInStock,
		unitsOnOrder: Number DATASOURCE unitsOnOrder,
		reorderLevel: Number DATASOURCE reorderLevel,
		discontinued: Text DATASOURCE discontinued,
		companyName: Text DATASOURCE companyName,
		contactName: Text DATASOURCE contactName,
		contactTitle: Text DATASOURCE contactTitle,
		address: Text DATASOURCE address,
		product_city: Text DATASOURCE product_city,
		region: Text DATASOURCE region,
		postalCode: Text DATASOURCE postalCode,
		product_country: Text DATASOURCE product_country,
		phone: Text DATASOURCE phone,
		fax: Text DATASOURCE fax,
		categoryID: Number DATASOURCE categoryID
	} WITH ID: productID AND DESCRIPTION: productID,
	CREATE LEVEL product_name WITH ATTRIBUTES{
		productName: Text DATASOURCE productName
	} WITH ID: productName AND DESCRIPTION: productName,
	CREATE LEVEL category WITH ATTRIBUTES{
		categoryName: Text DATASOURCE categoryName
	} WITH ID: categoryName AND DESCRIPTION: categoryName,
	CREATE LEVEL All_products_dim WITH ATTRIBUTES{
		All: Text DATASOURCE All
	} WITH ID: All AND DESCRIPTION: All	
}
HIERARCHY product>product_name>category>All_products_dim
DATASOURCE products_dim;


CREATE DIMENSION shippers_dim
LIST OF LEVELS {
	CREATE LEVEL shipper WITH ATTRIBUTES{
		shipperID: Number DATASOURCE shipperID,
		companyName: Text DATASOURCE companyName,
		phone: Text DATASOURCE phone
	} WITH ID: companyName AND DESCRIPTION: companyName,
	CREATE LEVEL All_shippers_dim WITH ATTRIBUTES{
		All: Text DATASOURCE All
	} WITH ID: All AND DESCRIPTION: All	
}
HIERARCHY shipper>All_shippers_dim
DATASOURCE shippers_dim;


CREATE DIMENSION shipments_dim
LIST OF LEVELS {
	CREATE LEVEL shipment WITH ATTRIBUTES{
		shipmentID: Number DATASOURCE shipmentID,
		postalCode: Text DATASOURCE postalCode
	} WITH ID: shipmentID AND DESCRIPTION: shipmentID,
	CREATE LEVEL city WITH ATTRIBUTES{
		shipment_city: Text DATASOURCE shipment_city
	} WITH ID: shipment_city AND DESCRIPTION: shipment_city,
	CREATE LEVEL country WITH ATTRIBUTES{
		shipment_country: Text DATASOURCE shipment_country
	} WITH ID: country AND DESCRIPTION: country,
	CREATE LEVEL All_shipment_dim WITH ATTRIBUTES{
		All: Text DATASOURCE All
	} WITH ID: All AND DESCRIPTION: All	
}
HIERARCHY shipment>city>country>All_shipment_dim
DATASOURCE shipments_dim;


CREATE CUBE orders_cube
DATASOURCE orders
MEASURES unit_price AT orders.o_unitPrice,
		 quantity AT orders.o_quantity,
		 discount AT orders.o_discount
REFERENCES DIMENSION customers_dim AT orders.o_customerID,
					 date_dim AT orders.o_orderDate,
					 employees_dim AT orders.o_employeeID,
					 products_dim AT orders.o_productID,
					 shippers_dim AT orders.o_shipVia,
					 shipments_dim AT orders.o_shipmentID
					 